name: Deploy MCNexus site

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "docs/**"
      - "pt-BR/**"
      - "*.md"
      - "scripts/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build documentation pages
        shell: bash
        run: |
          node scripts/build-docs.mjs

      - name: Version static assets
        shell: bash
        run: |
          find site -type f -name "*.html" -exec sed -i "s/__SITE_VERSION__/${GITHUB_SHA}/g" {} +
          ! grep -rn "__SITE_VERSION__" site/

      - name: Validate static site
        shell: bash
        run: |
          test -f site/index.html
          test -f site/pt-BR/index.html
          node -e "JSON.parse(require('fs').readFileSync('site/assets/data/products.json', 'utf8'))"
          test -z "$(find site -type l -print -quit)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
